<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { min-height: 100vh; display: flex; flex-direction: column; transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1), color 0.6s; overflow-x: hidden; position: relative; }

/* Light Theme */
.light {
  --bg-primary: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
  --text-primary: #333333; --text-secondary: #666666;
  --card-bg: rgba(255,255,255,0.9); --card-border: rgba(0,0,0,0.1);
  --card-shadow: 0 12px 30px rgba(0,0,0,0.1), 0 0 20px rgba(0,0,0,0.05);
  --accent: #4CAF50; --accent-light: #81C784;
  --accent-gradient: linear-gradient(135deg, #4CAF50, #81C784);
  --sidebar-bg: linear-gradient(160deg, #f7f7f7, #e9e9e9);
  --input-bg: rgba(255,255,255,0.8); --icon-color: #4CAF50;
  --toggle-bg: #ffffff; --glow: 0 0 15px rgba(76,175,80,0.3);
  --particles-color: #4CAF50;
  --sidebar-nav-item-hover-bg: rgba(76,175,80,0.15);
  --sidebar-nav-item-active-bg: rgba(76,175,80,0.25);
  --sidebar-nav-item-active-border: #4CAF50;
  --ai-assistant-bg: rgba(240,240,240,0.8);
  --message-idea-bg: #e9f5e9; --message-idea-border: #c8e6c9;
  --message-idea-text: #388e3c; --message-idea-hover-bg: #d7edd7;
  --success-bg: #e8f5e9; --success-border: #c8e6c9; --success-text: #2e7d32;
  --error-bg: #ffebee; --error-border: #ffcdd2; --error-text: #c62828;
}

/* Dark Theme — Horror Pink */
.dark {
  --bg-primary: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
  --text-primary: #e6e6e6; --text-secondary: #b0b0b0;
  --card-bg: rgba(10,10,10,0.9); --card-border: rgba(255,0,122,0.4);
  --card-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 25px rgba(255,0,122,0.3);
  --accent: #ff007a; --accent-light: #ff4da6;
  --accent-gradient: linear-gradient(135deg, #ff007a, #ff4da6);
  --sidebar-bg: linear-gradient(160deg, #1f1f1f, #121212);
  --input-bg: rgba(10,10,10,0.8); --icon-color: #ff4da6;
  --toggle-bg: #000000; --glow: 0 0 20px rgba(255,0,122,0.6);
  --particles-color: #ff007a;
  --sidebar-nav-item-hover-bg: rgba(255,0,122,0.15);
  --sidebar-nav-item-active-bg: rgba(255,0,122,0.25);
  --sidebar-nav-item-active-border: #ff007a;
  --ai-assistant-bg: rgba(25,25,25,0.8);
  --message-idea-bg: #4a0e2e; --message-idea-border: #6b1543;
  --message-idea-text: #ff80bf; --message-idea-hover-bg: #5e113a;
  --success-bg: #1b5e20; --success-border: #388e3c; --success-text: #a5d6a7;
  --error-bg: #b71c1c; --error-border: #d32f2f; --error-text: #ffcdd2;
}

body { background: var(--bg-primary); color: var(--text-primary); }

#particles-js { position: absolute; width: 100%; height: 100%; z-index: -1; background: transparent; }

/* Mode Toggle */
.mode-toggle {
  position: fixed; top: 30px; right: 30px; width: 80px; height: 36px;
  border-radius: 50px; background: var(--toggle-bg); box-shadow: var(--glow);
  display: flex; align-items: center; padding: 0 6px; cursor: pointer; z-index: 1000;
  transition: background 0.6s, box-shadow 0.6s, transform 0.3s;
  animation: flicker 2s infinite alternate;
}
@keyframes flicker { 0%,18%,22%,25%,53%,57%,100%{opacity:1} 20%,24%,55%{opacity:0.5} }
.mode-toggle:hover { transform: scale(1.1); }
.toggle-circle {
  width: 28px; height: 28px; border-radius: 50%; position: absolute;
  transition: all 0.4s cubic-bezier(0.68,-0.55,0.27,1.55);
  display: flex; align-items: center; justify-content: center; box-shadow: var(--glow);
}
.light .toggle-circle { left: 6px; background: var(--accent); }
.dark .toggle-circle { left: 46px; background: var(--accent); }
.toggle-icon { position: absolute; color: #fff; font-size: 16px; transition: opacity 0.3s; }
.sun-icon { left: 12px; } .moon-icon { right: 12px; }
.light .moon-icon, .dark .sun-icon { opacity: 0; }
.light .sun-icon, .dark .moon-icon { opacity: 1; }

/* Layout */
.container { display: flex; width: 90%; max-width: 1300px; margin: 90px auto 50px; overflow: hidden; position: relative; z-index: 10; perspective: 1200px; }

/* Sidebar */
.sidebar {
  width: 320px; padding: 35px 25px; background: var(--sidebar-bg);
  color: var(--text-primary); flex-shrink: 0; border-radius: 28px;
  box-shadow: var(--card-shadow); position: relative; overflow: hidden; z-index: 2;
  transform-style: preserve-3d; border: 1px solid var(--card-border);
  transition: background 0.6s, transform 0.4s ease-out, box-shadow 0.6s;
}
.sidebar::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, var(--accent) 0.05, rgba(0,0,0,0.7) 80%);
  transform: rotate(30deg); z-index: -1; opacity: 0.08; transition: opacity 0.5s;
}
.sidebar:hover::before { opacity: 0.15; }
.sidebar:hover { transform: translateY(-10px) translateZ(20px) scale(1.02); box-shadow: 0 20px 45px rgba(0,0,0,0.2), var(--glow); }

.profile-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; text-align: center; }
.profile-img {
  width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent);
  background: linear-gradient(45deg, var(--accent-light), var(--accent));
  margin-bottom: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1), var(--glow);
  display: flex; align-items: center; justify-content: center;
}
.profile-img img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-header h1 {
  font-size: 2.2rem; letter-spacing: 1.5px; margin-bottom: 6px; text-transform: uppercase;
  background: linear-gradient(to right, var(--accent), var(--text-primary) 70%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sidebar-header h2 { font-size: 1.1rem; font-weight: 400; color: var(--text-secondary); margin-top: 5px; letter-spacing: 2px; }

.sidebar nav ul { list-style: none; margin-top: 25px; padding: 0; }
.sidebar nav ul li { margin-bottom: 10px; }
.sidebar nav ul li a {
  display: flex; align-items: center; padding: 15px 20px; border-radius: 12px;
  color: var(--text-primary); text-decoration: none; font-size: 1.05rem; font-weight: 500;
  transition: all 0.3s ease; border-left: 4px solid transparent; position: relative; overflow: hidden;
}
.sidebar nav ul li a:hover { background-color: var(--sidebar-nav-item-hover-bg); color: var(--accent); transform: translateX(5px); border-left-color: var(--accent); }
.sidebar nav ul li a.active { background-color: var(--sidebar-nav-item-active-bg); color: var(--accent); font-weight: 600; border-left-color: var(--sidebar-nav-item-active-border); }
.sidebar nav ul li a .icon { margin-right: 18px; font-size: 1.35rem; min-width: 28px; text-align: center; color: var(--icon-color); transition: color 0.3s, transform 0.3s; }
.sidebar nav ul li a:hover .icon, .sidebar nav ul li a.active .icon { color: var(--accent); }
.sidebar nav ul li a:hover .icon { transform: scale(1.1); }

/* Main */
.main { flex: 1; padding: 0 50px; display: flex; align-items: center; justify-content: center; }

/* Contact Card */
.contact-card {
  background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 25px;
  padding: 50px; box-shadow: var(--card-shadow); backdrop-filter: blur(15px);
  max-width: 650px; width: 100%; position: relative; overflow: hidden;
  transform-style: preserve-3d; animation: flicker 3s infinite alternate;
  transition: transform 0.4s ease-out, box-shadow 0.4s ease-out;
}
.contact-card::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, var(--accent) 0.05, rgba(0,0,0,0.7) 70%);
  z-index: -1; opacity: 0.1;
}
.contact-card:hover { transform: translateY(-10px) scale(1.02) translateZ(20px); box-shadow: 0 20px 45px rgba(0,0,0,0.2), var(--glow); }
.contact-card h1 {
  text-align: center; margin-bottom: 30px; font-size: 2.5rem; font-weight: 700;
  background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  position: relative; padding-bottom: 20px;
}
.contact-card h1::after {
  content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100px; height: 5px; background: var(--accent-gradient); border-radius: 3px; box-shadow: var(--glow);
}

/* AI Assistant */
.ai-message-assistant { background-color: var(--ai-assistant-bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--card-border); }
.ai-message-assistant h3 { font-size: 1.3rem; color: var(--accent); margin-bottom: 15px; text-align: center; }
.ai-message-assistant .form-group { margin-bottom: 15px; }
#generateMessageIdeasBtn { display: block; width: 100%; padding: 12px; background: var(--accent-gradient); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
#generateMessageIdeasBtn:hover { transform: translateY(-3px); box-shadow: 0 6px 15px var(--glow); }
#ideasLoadingIndicator { text-align: center; color: var(--text-secondary); font-style: italic; margin-top: 10px; display: none; }
#messageIdeasContainer { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
.message-idea { background-color: var(--message-idea-bg); border: 1px solid var(--message-idea-border); color: var(--message-idea-text); padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: background-color 0.3s, transform 0.2s; }
.message-idea:hover { background-color: var(--message-idea-hover-bg); transform: translateY(-2px); }

/* Form Fields */
.form-group { position: relative; margin-bottom: 30px; }
.form-label { position: absolute; top: 20px; left: 55px; color: var(--text-secondary); transition: all 0.3s ease; pointer-events: none; font-size: 1.1rem; }
.form-input { width: 100%; padding: 22px 22px 22px 55px; border-radius: 15px; border: 1px solid var(--card-border); font-size: 1.1rem; background: var(--input-bg); transition: border-color 0.3s, box-shadow 0.3s; color: var(--text-primary); }
.form-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--glow); }
.form-input:focus + .form-label,
.form-input:not(:placeholder-shown) + .form-label { top: -15px; left: 45px; background: var(--card-bg); padding: 0 10px; font-size: 0.9rem; color: var(--accent); border-radius: 4px; }
.form-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--icon-color); font-size: 1.3rem; transition: color 0.3s, transform 0.3s; }
.form-input:focus ~ .form-icon { color: var(--accent); transform: translateY(-50%) scale(1.2); }
textarea.form-input { min-height: 150px; resize: vertical; }
.textarea-group .form-icon { top: 24px; transform: none; }
.textarea-group .form-input:focus ~ .form-icon { transform: scale(1.1); }

/* Checkbox */
.checkbox-container { display: flex; align-items: center; margin: 25px 0; }
.checkbox-container input { width: 22px; height: 22px; margin-right: 15px; accent-color: var(--accent); cursor: pointer; }
.checkbox-container label { color: var(--text-primary); font-size: 1.1rem; cursor: pointer; }

/* Submit */
#submitBtn { width: 100%; padding: 18px; background: var(--accent-gradient); color: white; border: none; border-radius: 15px; font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden; box-shadow: var(--glow); display: flex; align-items: center; justify-content: center; gap: 10px; }
#submitBtn:hover:not(:disabled) { transform: translateY(-5px); box-shadow: 0 10px 25px var(--glow); }
#submitBtn:active { transform: translateY(1px); }
#submitBtn:disabled { opacity: 0.7; cursor: not-allowed; }
#submitBtn::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: left 0.6s; }
#submitBtn:hover::after { left: 100%; }

.spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s infinite; display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.go-home { display: block; margin: 50px auto 0; padding: 16px 40px; background: var(--accent-gradient); color: white; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: 600; text-align: center; text-decoration: none; transition: transform 0.3s, box-shadow 0.3s; max-width: 250px; position: relative; overflow: hidden; z-index: 10; box-shadow: var(--glow); }
.go-home:hover { transform: translateY(-5px); box-shadow: 0 10px 25px var(--glow); }

.footer { text-align: center; padding: 30px 0; color: var(--text-secondary); font-size: 1rem; margin-top: auto; position: relative; z-index: 10; background: var(--card-bg); backdrop-filter: blur(10px); }

/* Toast */
.toast { position: fixed; top: 30px; right: 30px; padding: 20px 25px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 15px; z-index: 2000; transform: translateX(150%); transition: transform 0.5s cubic-bezier(0.25,1,0.5,1); max-width: 400px; border: 1px solid; }
.toast { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
.toast.error { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
.toast.show { transform: translateX(0); }
.toast-icon { font-size: 1.8rem; }
.toast-content { flex: 1; }
.toast-title { font-weight: 600; font-size: 1.2rem; margin-bottom: 5px; }
.toast-message { font-size: 1rem; line-height: 1.4; }
.toast-close { background: transparent; border: none; color: inherit; font-size: 1.2rem; cursor: pointer; opacity: 0.7; padding: 5px; }
.toast-close:hover { opacity: 1; }

@media (max-width: 992px) { .container { flex-direction: column; margin: 70px auto 40px; } .sidebar { width: 100%; max-width: 550px; margin: 0 auto 50px; border-radius: 20px; } .main { padding: 0; } }
@media (max-width: 768px) { .container { width: 95%; } .contact-card { padding: 35px; } .contact-card h1 { font-size: 2.2rem; } .mode-toggle { top: 25px; right: 25px; } .toast { top: 20px; right: 20px; left: 20px; max-width: none; } }
@media (max-width: 480px) { .contact-card { padding: 30px 20px; } .contact-card h1 { font-size: 1.9rem; } .form-input { padding: 18px 18px 18px 50px; } .form-label { left: 50px; } .form-icon { left: 18px; } .sidebar { padding: 25px 15px; border-radius: 15px; } .profile-img { width: 100px; height: 100px; } .sidebar-header h1 { font-size: 1.8rem; } }
</style>
</head>

const EMAILJS_PUBLIC_KEY  = "YOUR_PUBLIC_KEY";
const EMAILJS_SERVICE_ID  = "YOUR_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";
// ═══════════════════════════════════════════════════════════

emailjs.init(EMAILJS_PUBLIC_KEY);

// Particles color sync
function updateParticlesColor(color) {
  try {
    if (window.pJSDom?.[0]?.pJS?.particles?.array) {
      window.pJSDom[0].pJS.particles.array.forEach(p => p.color = { value: color });
      window.pJSDom[0].pJS.fn.particlesDraw();
    }
  } catch(e) {}
}

// Theme toggle — default dark
function toggleMode() {
  const body = document.body;
  const isDark = body.classList.contains('dark');
  body.classList.remove(isDark ? 'dark' : 'light');
  body.classList.add(isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  updateParticlesColor(getComputedStyle(body).getPropertyValue('--particles-color').trim());
}

// Toast helpers
let _toastTimer;
function showToast(title, msg, isError = false) {
  const t = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').className = `toast-icon fas ${isError ? 'fa-circle-xmark' : 'fa-circle-check'}`;
  t.className = `toast${isError ? ' error' : ''} show`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(hideToast, 5500);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

// Form submit
document.getElementById('contactForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const name    = document.getElementById('clintInputName1').value.trim();
  const email   = document.getElementById('clintInputEmail1').value.trim();
  const message = document.getElementById('clintInputEnquiry').value.trim();

  if (!name || !email || !message) {
    showToast('Fields Missing!', 'Name, Email aur Message zaroori hain.', true);
    return;
  }
  if (EMAILJS_PUBLIC_KEY === 'YOUR_PUBLIC_KEY') {
    showToast('Setup Needed!', 'Code mein EmailJS keys daalo pehle. Instructions comments mein hain.', true);
    return;
  }

  const btn = document.getElementById('submitBtn');
  document.getElementById('submitText').textContent = 'Sending...';
  document.getElementById('submitIcon').style.display = 'none';
  document.getElementById('submitSpinner').style.display = 'block';
  btn.disabled = true;

  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      from_name:  name,
      from_email: email,
      phone:      document.getElementById('clinetphone').value.trim() || 'Not provided',
      message:    message,
      is_project: document.getElementById('isclient').checked ? '✅ Yes — wants a project' : '❌ No',
      reply_to:   email
    });
    showToast('Message Sent! ✅', 'MJ Abbasi will get back to you soon.', false);
    e.target.reset();
    document.getElementById('messageTopicInput').value = '';
    document.getElementById('messageIdeasContainer').innerHTML = '';
  } catch(err) {
    console.error(err);
    showToast('Send Failed!', 'Seedha email karo: jawadabbasi1107@gmail.com', true);
  } finally {
    document.getElementById('submitText').textContent = 'Send Message';
    document.getElementById('submitIcon').style.display = 'inline';
    document.getElementById('submitSpinner').style.display = 'none';
    btn.disabled = false;
  }
});

// Smart Message Assistant
document.getElementById('generateMessageIdeasBtn').addEventListener('click', async () => {
  const topic = document.getElementById('messageTopicInput').value.trim();
  const container = document.getElementById('messageIdeasContainer');
  const loader = document.getElementById('ideasLoadingIndicator');

  if (!topic) {
    container.innerHTML = '<p style="color:var(--accent);text-align:center;padding:8px">Pehle topic likho!</p>';
    setTimeout(() => { container.innerHTML = ''; }, 2500);
    return;
  }

  loader.style.display = 'block';
  container.innerHTML = '';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        messages: [{
          role: 'user',
          content: `Generate 3 short professional message opening suggestions (under 25 words each) for someone contacting a Python/Django developer about: "${topic}". Return ONLY a valid JSON array of 3 strings with no extra text or markdown.`
        }]
      })
    });
    const data = await res.json();
    let text = data.content?.[0]?.text || '[]';
    text = text.replace(/```json|```/g, '').trim();
    const ideas = JSON.parse(text);
    ideas.forEach(idea => {
      const div = document.createElement('div');
      div.className = 'message-idea';
      div.textContent = idea;
      div.onclick = () => {
        document.getElementById('clintInputEnquiry').value = idea;
        document.getElementById('clintInputEnquiry').focus();
      };
      container.appendChild(div);
    });
  } catch(err) {
    container.innerHTML = '<p style="color:var(--accent);text-align:center;padding:8px">Ideas nahi aye. Khud likho!</p>';
  } finally {
    loader.style.display = 'none';
  }
});

// Page init
document.addEventListener('DOMContentLoaded', () => {
  // Apply saved theme (default dark)
  const saved = localStorage.getItem('theme') || 'dark';
  document.body.className = saved;

  const color = getComputedStyle(document.body).getPropertyValue('--particles-color').trim();

  particlesJS("particles-js", {
    particles: {
      number: { value: 60, density: { enable: true, value_area: 800 } },
      color: { value: color }, shape: { type: "circle" },
      opacity: { value: 0.4, random: true }, size: { value: 4, random: true },
      line_linked: { enable: false },
      move: { enable: true, speed: 0.5, direction: "none", random: true, straight: false, out_mode: "out" }
    },
    interactivity: {
      detect_on: "canvas",
      events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: true, mode: "push" }, resize: true }
    }
  });

  // Active nav
  const page = window.location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll('.sidebar nav ul li a').forEach(a => {
    if (a.getAttribute('href').split("/").pop() === page) a.classList.add('active');
  });
});
</script>
